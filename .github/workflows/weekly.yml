name: Radensa - Pipeline Mingguan

# Satu workflow mingguan menangani ingest iklim + retrain + forecast. Retune
# penuh (Optuna+CV) vs refit ringan diputuskan DI DALAM workflow ini lewat
# scripts/check_retune_due.py (~tiap 5 minggu) - bukan dua cron terpisah.
#
# CATATAN PENTING - ingest DBD TIDAK ada di workflow ini:
# surveilans-dinkes.jakarta.go.id memblokir/me-reset koneksi dari rentang IP
# cloud (diverifikasi langsung 17 Nov 2026: curl -v dari runner GitHub Actions
# selalu "Connection reset by peer" tepat setelah TLS ClientHello, sebelum
# HTTP/User-Agent apa pun terkirim -- jadi bukan soal header, ini blokir
# jaringan aktif terhadap IP Azure/cloud). Scraping DBD dijalankan TERPISAH
# via Windows Task Scheduler di komputer lokal (scripts/run_ingest_dbd.ps1).
#
# JALUR UTAMA vs FALLBACK: scrape lokal yang SUKSES langsung memicu workflow
# ini seketika itu juga (gh workflow run, lihat run_ingest_dbd.ps1) -- bukan
# menunggu cron di bawah. Cron Rabu 20:00 WIB di sini HANYA jaring pengaman
# kalau rantai pemicu itu gagal total (mis. laptop tidak pernah nyala
# sepanjang hari Rabu) -- supaya forecast tetap ter-update tiap minggu
# (pakai data lama) walau laptop lupa dinyalakan, bukan skip sepenuhnya.
on:
  schedule:
    - cron: '0 13 * * 3' # Rabu 13:00 UTC = 20:00 WIB (fallback, lihat catatan di atas)
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Ingest iklim GEE (rolling ~8 minggu terakhir)
        run: python radensa/ingest_iklim.py

      - name: Cek apakah retune penuh sudah waktunya
        id: check_retune
        run: python scripts/check_retune_due.py
        continue-on-error: true

      - name: Retune penuh (Optuna 100 trial + CV) - tiap ~5 minggu
        if: steps.check_retune.outcome == 'success'
        run: python radensa/train.py --n-trials 100

      - name: Retrain ringan (params terakhir, tanpa Optuna) - mingguan
        if: steps.check_retune.outcome == 'failure'
        run: python radensa/train.py --refit-only

      - name: Forecast 5 minggu ke depan + zonasi
        run: python radensa/forecast.py

      - name: Ringkasan run
        if: always()
        run: |
          echo "### Radensa - ringkasan run $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode retrain: ${{ steps.check_retune.outcome == 'success' && 'RETUNE PENUH' || 'refit ringan' }}" >> "$GITHUB_STEP_SUMMARY"
